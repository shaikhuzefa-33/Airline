<!DOCTYPE html>
<html lang="en">
<head>
    <script>!function(){var t=localStorage.getItem('huzefa-theme')||(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);}();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huzefa Airlines | Contact Module</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ── Dark / Light Toggle ── -->
    <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Switch to light mode" title="Switch to light mode">
        <i id="themeToggleIcon" class="fa-solid fa-sun"></i>
        <span id="themeToggleLabel">Light</span>
    </button>

    <button id="backToTop" class="back-to-top" title="Back to top"><i class="fa-solid fa-chevron-up"></i></button>

    <header class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="images/logo_gold.png" alt="Huzefa Airlines Logo" class="logo-img" />
                <span class="logo-text">Huzefa <span>Airlines</span></span>
            </a>
            <nav class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="flights.html" class="nav-link">Flights</a>
                <a href="destinations.html" class="nav-link">Destinations</a>
                <a href="offers.html" class="nav-link">Offers</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link active">Contact</a>
                <a href="status.html" class="nav-link"><i class="fa-solid fa-satellite-dish text-gold"></i> Status</a>
                <a href="admin.html" class="nav-link admin-nav-link" style="display: none !important; color: var(--gold); font-weight:700;"><i class="fa-solid fa-user-shield text-gold"></i> Admin Portal</a>
                <div class="mobile-auth-btns"></div>
            </nav>
            <div class="nav-auth"></div>
            <button class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <section class="section-padding" style="padding-top: 140px;" id="contact">
        <div class="container">
            <div class="section-header text-center">
                <span class="section-subtitle">CONCIERGE & SUPPORT MODULE</span>
                <h2 class="section-title">Contact Huzefa Airlines</h2>
                <p class="section-desc">Reach out to our global 24/7 travel support team.</p>
            </div>

            <div class="glass-booking-card" style="max-width: 800px; margin: 0 auto;">
                <form class="booking-form" onsubmit="event.preventDefault(); alert('Message sent to Huzefa Airlines Concierge!');">
                    <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
                        <div class="form-group">
                            <label><i class="fa-solid fa-user"></i> Full Name</label>
                            <input type="text" placeholder="Your name" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fa-solid fa-envelope"></i> Email Address</label>
                            <input type="email" placeholder="your@email.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-pen"></i> Subject</label>
                        <select>
                            <option>Booking Assistance</option>
                            <option>Baggage Inquiry</option>
                            <option>Special Assistance</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-comment"></i> Message</label>
                        <textarea rows="4" placeholder="How can we help you?" style="width:100%; padding:0.85rem 1rem; border:1.5px solid #dbe3f0; border-radius:12px;" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Huzefa Airlines. All rights reserved.</p>
            </div>
        </div>
    </footer>
    <script src="theme.js"></script>
    <script src="script.js"></script>
</body>
</html>
